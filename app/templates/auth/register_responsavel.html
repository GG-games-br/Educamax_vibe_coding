{% extends "base.html" %}

{% block title %}Cadastro de Responsável — EducaMax{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 24px auto;">
    <div class="card">
        <div class="card-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 class="card-title">Cadastro de Responsável</h2>
                    <p class="card-subtitle">Área para pais e responsáveis legais</p>
                </div>
                <span class="badge-status badge-ativo">Acesso Imediato</span>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.cadastro_responsavel') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="nome" class="form-label">Nome Completo do Responsável *</label>
                <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Maria das Graças Silva">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf" class="form-label">CPF (somente números) *</label>
                    <input type="text" id="cpf" name="cpf" class="form-control" maxlength="11" required placeholder="12345678901">
                </div>
                <div class="form-group">
                    <label for="numero" class="form-label">Telefone / WhatsApp de Contato</label>
                    <input type="text" id="numero" name="numero" class="form-control" placeholder="(98) 98765-4321">
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">E-mail para Login e Notificações *</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="responsavel@email.com">
                <p class="form-help">Utilizado para acesso ao portal e recebimento de avisos escolares.</p>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha" class="form-label">Senha de Acesso *</label>
                    <input type="password" id="senha" name="senha" class="form-control" minlength="6" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirmacao_senha" class="form-label">Confirmar Senha *</label>
                    <input type="password" id="confirmacao_senha" name="confirmacao_senha" class="form-control" minlength="6" required placeholder="Repita a senha">
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="flex: 2;">
                    Finalizar Cadastro de Responsável
                </button>
                <a href="{{ url_for('auth.cadastro_hub') }}" class="btn btn-secondary" style="flex: 1;">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
